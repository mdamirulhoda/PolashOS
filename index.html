<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PolashOS</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0d1117;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;
}

.container{
max-width:700px;
padding:20px;
}

h1{
font-size:60px;
color:#58a6ff;
margin-bottom:20px;
}

p{
font-size:22px;
margin-bottom:30px;
color:#c9d1d9;
}

button{
padding:15px 35px;
font-size:20px;
border:none;
border-radius:8px;
background:#238636;
color:white;
cursor:pointer;
}

button:hover{
background:#2ea043;
}
</style>

</head>
<body>

<div class="container">
<h1>PolashOS</h1>

<p>
The world's most realistic browser-based Web Operating System.
</p>

<button onclick="alert('Welcome to PolashOS!')">
Launch PolashOS
</button>

</div>

</body>
</html>
