<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PolashOS</title>

    <meta name="description" content="PolashOS - A Real Browser Operating System">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ========================= -->
    <!-- Genesis Boot -->
    <!-- ========================= -->

    <div id="boot-screen">

        <div class="boot-content">

            <h1 class="boot-logo">PolashOS</h1>

            <p class="boot-status">
                Initializing Polaris Engine...
            </p>

            <div class="boot-loader">
                <div class="boot-progress"></div>
            </div>

        </div>

    </div>

    <!-- ========================= -->
    <!-- Lock Screen -->
    <!-- ========================= -->

    <section id="lock-screen" hidden>

        <div class="lock-content">

            <h2>PolashOS</h2>

            <p>Welcome Back</p>

            <button id="unlockBtn">
                Unlock
            </button>

        </div>

    </section>

    <!-- ========================= -->
    <!-- Aurora Desktop -->
    <!-- ========================= -->

    <main id="desktop">

        <!-- Desktop Icons -->

        <div id="desktop-icons">

            <div class="desktop-icon">
                🌐
                <span>Polaris Browser</span>
            </div>

            <div class="desktop-icon">
                📁
                <span>Atlas Files</span>
            </div>

            <div class="desktop-icon">
                💻
                <span>Nova Terminal</span>
            </div>

            <div class="desktop-icon">
                ⚙️
                <span>Control Center</span>
            </div>

        </div>

        <!-- Windows -->

        <section id="windows"></section>

        <!-- Taskbar -->

        <footer id="taskbar">

            <div id="start-button">
                ⊞
            </div>

            <div id="taskbar-apps"></div>

            <div id="system-tray">

                <span>📶</span>

                <span>🔊</span>

                <span id="clock">
                    00:00
                </span>

            </div>

        </footer>

    </main>

    <!-- ========================= -->
    <!-- Start Menu -->
    <!-- ========================= -->

    <aside id="start-menu" hidden>

        <h3>PolashOS</h3>

        <ul>

            <li>🌐 Polaris Browser</li>

            <li>📁 Atlas Files</li>

            <li>💻 Nova Terminal</li>

            <li>⚙️ Control Center</li>

        </ul>

    </aside>

    <script src="script.js"></script>

</body>

</html>
