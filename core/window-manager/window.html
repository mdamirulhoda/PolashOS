<!-- ==========================================
     PolashOS Window Template v1.1
========================================== -->

<div class="polash-window" id="polashWindow">

    <!-- Titlebar -->
    <div class="polash-titlebar">

        <span class="window-title">
            PolashOS App
        </span>

        <div class="window-controls">

            <button
                class="window-btn window-minimize"
                title="Minimize">
            </button>

            <button
                class="window-btn window-maximize"
                title="Maximize">
            </button>

            <button
                class="window-btn window-close"
                title="Close">
            </button>

        </div>

    </div>

    <!-- Content -->
    <div class="polash-content">

        App Content Here

    </div>

    <!-- Resize Handle -->
    <div
        class="resize-handle"
        aria-hidden="true">
    </div>

</div>
